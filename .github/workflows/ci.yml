# CI for every pull request, the merge queue and main.
# "ci-ok" is the one required status check: it fails when any job below failed or was
# cancelled, and passes when they succeeded or were skipped.
#
# Bot pull requests (tools/bot_pr.sh) are pushed and opened with the workflow token, which
# starts no pull_request or push run. The script starts this workflow on the bot/ branch with
# workflow_dispatch instead, and that run's ci-ok on the head commit is the one the ruleset
# reads.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - run: cargo fmt --all -- --check

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Linux only to spare runners; the merge queue and main run all three OS.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-15-intel", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The classfile JDK round-trip test fails, instead of skipping, without a JDK.
      JARROW_REQUIRE_JDK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Line coverage of the workspace tests, reported to Codecov. Informational for now: nothing
  # fails on the number (codecov.yml, docs/releases.md#test-coverage).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The same tests as the rust job, so the classfile JDK round-trip test runs here too.
      JARROW_REQUIRE_JDK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml, with llvm-tools
        run: rustup toolchain install && rustup component add llvm-tools && rustc --version
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Write the total line coverage into the job summary
        run: python3 tools/coverage_summary.py lcov.info
      # Forks and Dependabot get no repository secrets, so they skip the upload.
      - name: Upload to Codecov
        if: >-
          !github.event.repository.fork && github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Linux only to spare runners; the merge queue and main run all three OS.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-15-intel", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install --require-hashes -r tools/requirements-dev.txt
      - run: python -m pytest tools/tests -p no:cacheprovider
      - name: research-lock.json is well formed (offline)
        run: python tools/research_lock.py --check

  site:
    name: site (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Linux only to spare runners; the merge queue and main run all three OS.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-15-intel", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for crates/wasm
        id: crate
        run: |
          if [ -f crates/wasm/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates/wasm not built yet (milestone M3)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.crate.outputs.present == 'true'
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.crate.outputs.present == 'true'
      - name: Build for wasm32 and check the 4 MiB gzip budget
        if: steps.crate.outputs.present == 'true'
        run: |
          set -euo pipefail
          budget=$((4 * 1024 * 1024))
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path crates/wasm/Cargo.toml
          shopt -s nullglob
          files=(target/wasm32-unknown-unknown/release/*.wasm)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::crates/wasm built no .wasm file (is it a cdylib?)"
            exit 1
          fi
          status=0
          echo "| File | Raw bytes | Gzipped bytes | Budget |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for file in "${files[@]}"; do
            raw=$(wc -c < "$file")
            gz=$(gzip -9 -n -c "$file" | wc -c)
            echo "$(basename "$file"): $raw bytes raw, $gz bytes gzipped, budget $budget"
            echo "| $(basename "$file") | $raw | $gz | $budget |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$gz" -gt "$budget" ]; then
              echo "::error::$(basename "$file") is $gz bytes gzipped, over the $budget byte budget"
              status=1
            fi
          done
          exit "$status"

  pr-ready:
    name: pr-ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the pull request's commits and tree
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/pr_ready.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Check the tree
        if: github.event_name != 'pull_request'
        run: python tools/pr_ready.py --all

  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, rust, coverage, deny, python, site, wasm, pr-ready]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      # needs.*.result hides matrix legs: a cancelled macOS leg can leave the aggregate
      # "success". So this gate reads every job of the run and accepts only success or skipped.
      - name: Every job in this run passed or was skipped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.name != "ci-ok") | "\(.name)|\(.conclusion)"')
          echo "$jobs"
          bad=$(printf '%s\n' "$jobs" | awk -F'|' '$2 != "success" && $2 != "skipped"')
          if [ -n "$bad" ]; then
            echo "::error::Jobs that did not pass:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All jobs passed or were skipped."
